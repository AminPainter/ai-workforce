services:
  app:
    build: .
    ports:
      - '51515:51515'
    env_file: .env
    environment:
      - PORT=51515
      - SEARXNG_BASE_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://ai_workforce:ai_workforce@postgres:5432/ai_workforce
    depends_on:
      - searxng
      - redis
      - postgres
    restart: unless-stopped

  searxng:
    build: ./searxng
    ports:
      - '8080:8080' # debug only
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in .env} # only this, not the app's secrets
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro # iterate on config w/o rebuild
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379' # debug only
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - '5432:5432' # debug only
    environment:
      - POSTGRES_USER=ai_workforce
      - POSTGRES_PASSWORD=ai_workforce
      - POSTGRES_DB=ai_workforce
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres-data:
