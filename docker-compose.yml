services:
  app:
    build: .
    ports:
      - '51515:51515'
      - '8080:8080' # SearXNG, exposed for local debugging only
    env_file: .env # must include SEARXNG_SECRET
    environment:
      - PORT=51515
      - SEARXNG_BASE_URL=http://127.0.0.1:8080
      - REDIS_URL=redis://redis:6379
      # overrides any DATABASE_URL in .env: the app talks to the postgres service by hostname.
      # (host-run `pnpm db:migrate` / `pnpm ingest` use the .env DATABASE_URL → localhost:5432.)
      - DATABASE_URL=postgres://rag:rag@postgres:5432/rag
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro # iterate on config w/o rebuild
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379' # debug only
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    ports:
      - '5432:5432' # host-run migrate/ingest connect here
    volumes:
      - rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d rag']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rag-pgdata:
