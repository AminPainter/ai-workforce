services:
  - type: web
    name: glomo-ai-workforce
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter # 'free' cold-starts; Slack webhooks need it warm
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEARXNG_BASE_URL
        value: http://127.0.0.1:8080
      # PORT is injected by Render — do not set it.
      - key: SEARXNG_SECRET
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        sync: false
      - key: AI_GATEWAY_MODEL
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ATLASSIAN_EMAIL
        sync: false
      - key: ATLASSIAN_API_TOKEN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glomo-ai-workforce-redis
          property: connectionString
      # BullMQ queue tunables — all have safe in-code defaults; listed for discoverability.
      - key: QUEUE_JOB_ATTEMPTS
        value: "3"
      - key: QUEUE_BACKOFF_MS
        value: "5000"
      - key: CONTRACT_DRIFT_CONCURRENCY
        value: "1"
      - key: ALLOYDB_MCP_URL
        value: http://teleport-alloydb-mcp:10000/mcp
      - key: ALLOYDB_MCP_API_KEY
        sync: false
      - key: BAKAR_SLACK_CHANNEL
        sync: false
      # #leaves → RazorpayX Payroll leave bot.
      - key: LEAVES_SLACK_CHANNEL
        value: C0806NMM3L7
      - key: LEAVES_BOT_MODE
        value: shadow
      - key: LEAVES_SHADOW_SLACK_CHANNEL
        sync: false
      - key: LEAVES_PEOPLE_PARTNER_SLACK_USER_ID
        sync: false
      - key: LEAVES_EMAIL_OVERRIDES
        sync: false
      - key: RAZORPAYX_PAYROLL_COMPANIES
        sync: false
      # Add SLACK_APP_TOKEN / *_MCP_URL as sync:false only if the populated .env needs them.

  - type: keyvalue
    name: glomo-ai-workforce-redis
    region: singapore # match the web service region
    plan: starter # 'free' is non-persistent + tiny; 'starter'+ persists
    maxmemoryPolicy: noeviction # protect BullMQ jobs / Chat locks from eviction
    ipAllowList: [] # empty = private (internal Render network only)

  - type: web
    name: teleport-alloydb-mcp
    runtime: docker
    dockerfilePath: ./teleport-alloydb-mcp/Dockerfile
    dockerContext: ./teleport-alloydb-mcp
    region: singapore
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: TELEPORT_PROXY
        value: teleport.glomopay-eng.com:443
      - key: TELEPORT_TOKEN
        value: render-agent
      - key: TELEPORT_DB_URI
        value: teleport://clusters/prod-teleport/databases/alloydb-production?dbName=glomopay_service&dbUser=teleport-token-v2@glomopay-production.iam
      - key: MCP_PROXY_API_KEY
        sync: false
      - key: TBOT_BOUND_KEYPAIR_STATIC_KEY
        sync: false
