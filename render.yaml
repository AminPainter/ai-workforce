services:
  - type: web
    name: glomo-ai-workforce
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter # 'free' cold-starts; Slack webhooks need it warm
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEARXNG_BASE_URL
        value: http://127.0.0.1:8080
      # PORT is injected by Render — do not set it.
      - key: SEARXNG_SECRET
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        sync: false
      - key: AI_GATEWAY_MODEL
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ATLASSIAN_EMAIL
        sync: false
      - key: ATLASSIAN_API_TOKEN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glomo-ai-workforce-redis
          property: connectionString
      # RAG / legal-assistant. DATABASE_URL wired from the managed Postgres below.
      - key: DATABASE_URL
        fromDatabase:
          name: glomo-ai-workforce-pg
          property: connectionString
      - key: AI_GATEWAY_EMBEDDING_MODEL
        sync: false
      # Must equal the embedding model's output dimension (from the Step 0 probe). Set once;
      # changing it requires a re-index + re-ingest.
      - key: RAG_EMBEDDING_DIMENSIONS
        sync: false
      # RAG tunables — safe in-code defaults; listed for discoverability.
      - key: RAG_RETRIEVAL_TOP_K
        value: "5"
      - key: RAG_CHUNK_CHARS
        value: "1800"
      - key: RAG_CHUNK_OVERLAP
        value: "300"
      - key: LEGAL_ASSISTANT_MAX_STEPS
        value: "20"
      # BullMQ queue tunables — all have safe in-code defaults; listed for discoverability.
      - key: QUEUE_JOB_ATTEMPTS
        value: "3"
      - key: QUEUE_BACKOFF_MS
        value: "5000"
      - key: CONTRACT_DRIFT_CONCURRENCY
        value: "1"
      # Add SLACK_APP_TOKEN / *_MCP_URL as sync:false only if the populated .env needs them.

  - type: keyvalue
    name: glomo-ai-workforce-redis
    region: singapore # match the web service region
    plan: starter # 'free' is non-persistent + tiny; 'starter'+ persists
    maxmemoryPolicy: noeviction # protect BullMQ jobs / Chat locks from eviction
    ipAllowList: [] # empty = private (internal Render network only)

databases:
  - name: glomo-ai-workforce-pg
    region: singapore # match the web service region
    plan: basic-256mb # smallest paid tier that persists; scale up as the corpus grows
    postgresMajorVersion: "16" # pgvector's `vector` extension is available on managed Postgres
    ipAllowList: [] # empty = private (internal Render network only)
