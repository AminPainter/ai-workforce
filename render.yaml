services:
  - type: web
    name: glomo-ai-workforce
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter # 'free' cold-starts; Slack webhooks need it warm
    healthCheckPath: /health
    autoDeployTrigger: commit
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glomo-ai-workforce-db
          property: connectionString
      - key: SEARXNG_BASE_URL
        value: http://glomo-ai-workforce-searxng:8080
      # PORT is injected by Render — do not set it.
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ATLASSIAN_EMAIL
        sync: false
      - key: ATLASSIAN_API_TOKEN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glomo-ai-workforce-redis
          property: connectionString
      # BullMQ queue tunables — all have safe in-code defaults; listed for discoverability.
      - key: QUEUE_JOB_ATTEMPTS
        value: "3"
      - key: QUEUE_BACKOFF_MS
        value: "5000"
      - key: ALLOYDB_MCP_URL
        value: http://teleport-alloydb-mcp:10000/mcp
      - key: ALLOYDB_MCP_API_KEY
        sync: false
      - key: BAKAR_SLACK_CHANNEL
        sync: false
      # Gateway model id for the employee assistant; defaults to grok-4.7 in code.
      - key: EMPLOYEE_ASSISTANT_MODEL
        sync: false
      # #leaves → RazorpayX Payroll leave bot.
      - key: LEAVES_SLACK_CHANNEL
        sync: false
      - key: LEAVES_SLACK_BOT_TOKEN
        sync: false
      - key: LEAVES_SLACK_SIGNING_SECRET
        sync: false
      - key: LEAVES_PEOPLE_PARTNER_SLACK_USER_ID
        sync: false
      - key: RAZORPAYX_PAYROLL_COMPANIES
        sync: false
      # glomopay_service routes → kong PR sync.
      - key: KONG_ROUTE_SYNC_AUTHOR_DENYLIST
        sync: false
      # Add SLACK_APP_TOKEN / *_MCP_URL as sync:false only if the populated .env needs them.

  - type: worker
    name: glomo-ai-workforce-coding-agent
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    region: singapore
    plan: standard # coding harness + git + repo toolchains need more than starter's 512 MB
    autoDeployTrigger: "off" # a deploy kills the coding task in progress
    disk:
      name: coding-workspaces
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: glomo-ai-workforce-redis
          property: connectionString
      - key: CODING_AGENT_WORKSPACES_DIR
        value: /var/data/coding
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AI_GATEWAY_BASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false

  - type: pserv
    name: glomo-ai-workforce-searxng
    runtime: docker
    dockerfilePath: ./searxng/Dockerfile
    dockerContext: ./searxng
    region: singapore
    plan: starter
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - searxng/**
    envVars:
      - key: SEARXNG_SECRET
        sync: false

  - type: keyvalue
    name: glomo-ai-workforce-redis
    region: singapore # match the web service region
    plan: starter # 'free' is non-persistent + tiny; 'starter'+ persists
    maxmemoryPolicy: noeviction # protect BullMQ jobs / Chat locks from eviction
    ipAllowList: [] # empty = private (internal Render network only)

  - type: web
    name: teleport-alloydb-mcp
    runtime: docker
    dockerfilePath: ./teleport-alloydb-mcp/Dockerfile
    dockerContext: ./teleport-alloydb-mcp
    region: singapore
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: TELEPORT_PROXY
        value: teleport.glomopay-eng.com:443
      - key: TELEPORT_TOKEN
        value: render-agent
      - key: TELEPORT_DB_URI
        value: teleport://clusters/prod-teleport/databases/alloydb-production?dbName=glomopay_service&dbUser=teleport-token-v2@glomopay-production.iam
      - key: MCP_PROXY_API_KEY
        sync: false
      - key: TBOT_BOUND_KEYPAIR_STATIC_KEY
        sync: false

databases:
  - name: glomo-ai-workforce-db
    databaseName: ai_workforce
    user: ai_workforce
    region: singapore # match the web service region; immutable after creation
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    diskSizeGB: 5
    ipAllowList: [] # empty = private (internal Render network only)
